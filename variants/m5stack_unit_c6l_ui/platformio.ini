; M5Stack Unit C6L with OLED + button. Differs from variants/m5stack_unit_c6l:
;  - Wire on the internal bus (10/8) to drive the PI4IO expander (LoRa reset, ANT_SW, LNA_EN, button)
;  - no P_LORA_TX_LED: GPIO15 is the OLED reset line
;  - no SX126X_RXEN: GPIO5 is a Grove pin; RX enable is expander P5, switched off during TX
;  - TCXO 3.0 V (stock: 1.8 V)
;  - Grove HY2.0-4P port (GPIO4 white, GPIO5 yellow) = GPS UART (M5Stack Unit GPS v1.1)
;  - dual boot: companion in app0, repeater in app1 (flash_dualboot.sh); hold button at power-on to switch
[M5Stack_Unit_C6L_UI]
extends = esp32c6_base
board = esp32-c6-devkitm-1
board_build.partitions = variants/m5stack_unit_c6l_ui/partitions_dualboot.csv
board_upload.flash_size = 16MB
board_build.flash_mode = dio ; board manifest defaults to qio, which causes a boot crash-loop on this module
build_flags =
  ${esp32c6_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/m5stack_unit_c6l_ui
  -D P_LORA_SCLK=20
  -D P_LORA_MISO=22
  -D P_LORA_MOSI=21
  -D P_LORA_NSS=23
  -D P_LORA_DIO_1=7
  -D P_LORA_BUSY=19
  -D P_LORA_RESET=-1
  -D PIN_BUZZER=11
  -D PIN_BOARD_SDA=10
  -D PIN_BOARD_SCL=8
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.0 ; per Zephyr board DTS and Meshtastic (stock MeshCore variant has 1.8)
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D DISABLE_WIFI_OTA=1
  -D PIN_GPS_TX=4 ; C6L RX <- GPS TX (white). Pin names are from the GPS side
  -D PIN_GPS_RX=5 ; C6L TX -> GPS RX (yellow)
  -D GPS_BAUD_RATE=115200 ; Unit GPS v1.1 default
  -D PIN_OLED_CS=6
  -D PIN_OLED_DC=18
  -D PIN_OLED_RESET=15
  -D OLED_WIDTH=64
  -D OLED_HEIGHT=48
  -D DISPLAY_CLASS=U8g2Display
  -D U8G2_DISPLAY_TYPE=U8G2_SSD1306_64X48_ER_F_4W_HW_SPI
  -D U8G2_DISPLAY_ARGS='U8G2_R2,PIN_OLED_CS,PIN_OLED_DC,PIN_OLED_RESET' ; panel is mounted rotated 180
  -D U8G2_FONT_SMALL=u8g2_font_4x6_mr ; one step smaller than the 72x40 defaults (5x7 / 6x10)
  -D U8G2_FONT_LARGE=u8g2_font_5x7_mr
  -D PIN_USER_BTN=0 ; marker only, button is read via the expander (ExpanderButton)
build_src_filter = ${esp32c6_base.build_src_filter}
  +<../variants/m5stack_unit_c6l_ui>
  +<helpers/ui/U8g2Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/sensors>
lib_deps =
  ${esp32c6_base.lib_deps}
  ${sensor_base.lib_deps}
  stevemarple/MicroNMEA @ ^2.0.6
  olikraus/U8g2 @ ^2.35.19

[env:M5Stack_Unit_C6L_UI_repeater]
extends = M5Stack_Unit_C6L_UI
build_src_filter = ${M5Stack_Unit_C6L_UI.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${M5Stack_Unit_C6L_UI.build_flags}
  -D ADVERT_NAME='"Unit C6L Repeater"'
  -D SPIFFS_PARTITION_LABEL='"spiffs2"' ; own storage, so it can sit next to the companion (dual boot)
  -D ARDUINO_USB_CDC_ON_BOOT=1 ; CLI on the USB serial port
  -D ARDUINO_USB_MODE=1
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50

[env:M5Stack_Unit_C6L_UI_room_server]
extends = M5Stack_Unit_C6L_UI
build_src_filter = ${M5Stack_Unit_C6L_UI.build_src_filter}
  +<../examples/simple_room_server>
build_flags =
  ${M5Stack_Unit_C6L_UI.build_flags}
  -D ADVERT_NAME='"Unit C6L Room"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D ROOM_PASSWORD='"hello"'

[M5Stack_Unit_C6L_UI_companion]
extends = M5Stack_Unit_C6L_UI
build_flags = ${M5Stack_Unit_C6L_UI.build_flags}
  -I examples/companion_radio/ui-tiny
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D UI_RECENT_LIST_SIZE=3
  -D AUTO_OFF_MILLIS=60000
build_src_filter = ${M5Stack_Unit_C6L_UI.build_src_filter}
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-tiny/*.cpp>
lib_deps =
  ${M5Stack_Unit_C6L_UI.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:M5Stack_Unit_C6L_UI_companion_radio_ble]
extends = M5Stack_Unit_C6L_UI_companion
build_flags = ${M5Stack_Unit_C6L_UI_companion.build_flags}
  -D BLE_PIN_CODE=123456

[env:M5Stack_Unit_C6L_UI_companion_radio_usb]
extends = M5Stack_Unit_C6L_UI_companion
build_flags = ${M5Stack_Unit_C6L_UI_companion.build_flags}
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D ENABLE_USB_INTERFACE
